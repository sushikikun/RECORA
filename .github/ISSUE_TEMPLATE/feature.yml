name: "機能要望"
description: "新しい機能や改善案を、目的・範囲・検証方法とともに提案します。"
title: "[機能] "
body:
  - type: markdown
    attributes:
      value: |
        必要な情報を簡潔に記載してください。

        Risk / Execution / Spec level / Approval の選択は申告値です。OWNERまたは承認者が分類とblockerを確認し、Issue本文またはコメントへ正式記録するまで、このFormの入力だけで `Ready` にはなりません。

        主領域は `docs/recora-development-domains.md` の9開発領域から1つ選びます。Phase番号、画面内分類、DB Schemaとは別の分類です。

        秘密情報、`.env`の値、token、API key、DB URL、credentialは記載・添付しないでください。

  - type: dropdown
    id: primary_domain
    attributes:
      label: "主領域"
      description: "成果物の中心責務を持つ開発領域を1つ選択してください。"
      multiple: false
      options:
        - "1. 公開サイト"
        - "2. 顧客オンボーディング"
        - "3. 顧客画面"
        - "4. 管理画面"
        - "5. プロンプト・測定設計"
        - "6. AI測定・分析"
        - "7. 品質・公開・レポート"
        - "8. 顧客・契約・権限"
        - "9. 共通基盤"
    validations:
      required: true

  - type: dropdown
    id: related_domains
    attributes:
      label: "関連領域"
      description: "主領域以外に直接関係する領域を選択してください。該当しない場合は未選択にします。主領域と同じ領域は選択しません。"
      multiple: true
      options:
        - "1. 公開サイト"
        - "2. 顧客オンボーディング"
        - "3. 顧客画面"
        - "4. 管理画面"
        - "5. プロンプト・測定設計"
        - "6. AI測定・分析"
        - "7. 品質・公開・レポート"
        - "8. 顧客・契約・権限"
        - "9. 共通基盤"

  - type: dropdown
    id: implementation_phase
    attributes:
      label: "実装Phase"
      description: "9領域の番号とは別の実装Phaseを選択してください。"
      multiple: false
      options:
        - "Phase 3"
        - "Phase 4"
        - "Phase 5"
        - "Phase 6"
        - "Phase 7"
        - "Phase 8"
        - "Phase 9"
        - "Phase 10"
        - "Phase横断"
        - "未確定"
        - "該当なし"
    validations:
      required: true

  - type: dropdown
    id: technical_layer
    attributes:
      label: "技術層・Schema"
      description: "影響する主な技術配置を選択してください。複数選択可能です。「該当なし」と他の項目は同時に選択しません。"
      multiple: true
      options:
        - "api"
        - "publication"
        - "measurement"
        - "control"
        - "audit"
        - "その他"
        - "該当なし"
    validations:
      required: true

  - type: textarea
    id: purpose
    attributes:
      label: "目的"
      description: "この機能で達成したいことを記載してください。"
      placeholder: "例: Issue作成時に必要情報を揃え、着手前の確認漏れを減らす。"
    validations:
      required: true

  - type: textarea
    id: customer_value
    attributes:
      label: "ユーザー／顧客への価値"
      description: "誰に、どのような価値や改善を提供するか記載してください。"
      placeholder: "対象ユーザーと期待する価値を記載してください。"
    validations:
      required: true

  - type: textarea
    id: background
    attributes:
      label: "現在の問題・背景"
      description: "現状の課題、制約、発生経緯を記載してください。"
      placeholder: "現在困っていることと、その背景を記載してください。"
    validations:
      required: true

  - type: textarea
    id: desired_state
    attributes:
      label: "希望する状態"
      description: "完了後に、何がどのような状態になっているべきか記載してください。"
      placeholder: "利用者から見た望ましい状態を記載してください。"
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: "対象範囲"
      description: "変更してよい機能、画面、ファイル、データ、運用などを具体化してください。"
      placeholder: "対象となる領域を箇条書きで記載してください。"
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: "対象外"
      description: "このIssueでは変更しない領域や、別Issueで扱う内容を記載してください。"
      placeholder: "対象外がなければ「なし」と記載してください。"
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: "受け入れ条件"
      description: "完了を判定できる、検証可能な条件を記載してください。"
      placeholder: |
        - [ ] 条件1
        - [ ] 条件2
    validations:
      required: true

  - type: dropdown
    id: risk
    attributes:
      label: "Risk"
      description: "失敗時の影響、外部作用、復旧難度、必要権限の最大値から申告してください。"
      options:
        - "R0"
        - "R1"
        - "R2"
        - "R3"
    validations:
      required: true

  - type: dropdown
    id: execution
    attributes:
      label: "Execution"
      description: "想定する実行レーンを申告してください。Riskを下げるものではありません。"
      options:
        - "Cloud Codex"
        - "Local Codex"
        - "Human"
    validations:
      required: true

  - type: dropdown
    id: spec_level
    attributes:
      label: "Spec level"
      description: "必要な仕様の重さを申告してください。Noneは独立した詳細仕様書を作らない意味です。"
      options:
        - "None（独立した詳細仕様書なし）"
        - "Light"
        - "Full"
    validations:
      required: true

  - type: dropdown
    id: approval
    attributes:
      label: "Approval"
      description: "このIssueで必要と考える最も高い承認ゲートを申告してください。"
      options:
        - "None（個別承認なし）"
        - "Plan"
        - "Execute"
        - "Production"
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: "依存Issue・blocker"
      description: "先に完了が必要なIssue、外部判断、未解決事項を記載してください。"
      placeholder: "なければ「なし」と記載してください。"
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: "必須検証"
      description: "完了判定に使うコマンド、テスト、目視確認、Human review項目を記載してください。"
      placeholder: "実行する検証と期待結果を記載してください。"
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: "参考資料・画像"
      description: "関連Issue、仕様、画面、画像などを共有してください。秘密情報は含めないでください。"
      placeholder: "URLや補足資料を記載してください。なければ空欄で構いません。"
    validations:
      required: false
