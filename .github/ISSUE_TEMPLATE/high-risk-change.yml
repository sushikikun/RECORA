name: "高リスク変更"
description: "R2 / R3候補の変更について、影響、rollback、承認ゲートを整理します。"
title: "[高リスク変更] "
body:
  - type: markdown
    attributes:
      value: |
        R2 / R3候補の変更を安全に計画するためのFormです。

        Risk / Execution / Spec level / Approval の選択は申告値です。OWNERまたは承認者が分類とblockerを確認し、Issue本文またはコメントへ正式記録するまで、このFormの入力だけで `Ready` にはなりません。

        主領域は `docs/recora-development-domains.md` の9開発領域から1つ選びます。Phase番号、画面内分類、DB Schemaとは別の分類です。

        秘密情報、`.env`の値、token、API key、DB URL、credentialは記載・添付しないでください。無承認でproduction write、deploy、merge、secret変更を行わないでください。

  - type: dropdown
    id: primary_domain
    attributes:
      label: "主領域"
      description: "高リスク変更の中心責務を持つ開発領域を1つ選択してください。"
      multiple: false
      options:
        - "1. 公開サイト"
        - "2. 顧客オンボーディング"
        - "3. 顧客画面"
        - "4. 管理画面"
        - "5. プロンプト・測定設計"
        - "6. AI測定・分析"
        - "7. 品質・公開・レポート"
        - "8. 顧客・契約・権限"
        - "9. 共通基盤"
    validations:
      required: true

  - type: dropdown
    id: related_domains
    attributes:
      label: "関連領域"
      description: "主領域以外に直接関係する領域を選択してください。該当しない場合は未選択にします。主領域と同じ領域は選択しません。"
      multiple: true
      options:
        - "1. 公開サイト"
        - "2. 顧客オンボーディング"
        - "3. 顧客画面"
        - "4. 管理画面"
        - "5. プロンプト・測定設計"
        - "6. AI測定・分析"
        - "7. 品質・公開・レポート"
        - "8. 顧客・契約・権限"
        - "9. 共通基盤"

  - type: dropdown
    id: implementation_phase
    attributes:
      label: "実装Phase"
      description: "9領域の番号とは別の実装Phaseを選択してください。"
      multiple: false
      options:
        - "Phase 3"
        - "Phase 4"
        - "Phase 5"
        - "Phase 6"
        - "Phase 7"
        - "Phase 8"
        - "Phase 9"
        - "Phase 10"
        - "Phase横断"
        - "未確定"
        - "該当なし"
    validations:
      required: true

  - type: dropdown
    id: technical_layer
    attributes:
      label: "技術層・Schema"
      description: "影響する主な技術配置を選択してください。複数選択可能です。「該当なし」と他の項目は同時に選択しません。"
      multiple: true
      options:
        - "api"
        - "publication"
        - "measurement"
        - "control"
        - "audit"
        - "その他"
        - "該当なし"
    validations:
      required: true

  - type: textarea
    id: purpose
    attributes:
      label: "目的と必要性"
      description: "この高リスク変更が必要な理由と、実施しない場合の影響を記載してください。"
      placeholder: "解決したい問題、期待効果、実施期限の根拠を記載してください。"
    validations:
      required: true

  - type: textarea
    id: change_targets
    attributes:
      label: "変更対象"
      description: "対象システム、環境、機能、ファイル、データ、外部サービスを具体化してください。"
      placeholder: "変更対象と想定する操作を箇条書きで記載してください。"
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: "対象外"
      description: "このIssueでは変更しない領域や、別Issueで扱う内容を記載してください。"
      placeholder: "対象外がなければ「なし」と記載してください。"
    validations:
      required: true

  - type: textarea
    id: risk_areas
    attributes:
      label: "高リスク領域とproduction影響"
      description: "DB、migration、RLS、Auth、課金、外部API write、productionへの該当有無と影響を項目ごとに記載してください。"
      placeholder: |
        - DB / migration:
        - RLS / Auth:
        - 課金:
        - 外部API write:
        - production:
    validations:
      required: true

  - type: dropdown
    id: data_migration
    attributes:
      label: "データ移行"
      description: "データ移行の有無と確認状態を選択してください。"
      options:
        - "あり"
        - "なし"
        - "未確認（確認完了までblocker）"
    validations:
      required: true

  - type: textarea
    id: rollback
    attributes:
      label: "Rollback方針"
      description: "失敗の検知条件、戻す対象、手順、責任者、復旧確認を記載してください。"
      placeholder: "実行前のバックアップ、停止条件、復旧手順、所要時間を記載してください。"
    validations:
      required: true

  - type: textarea
    id: secret_handling
    attributes:
      label: "秘密情報・認証情報の取り扱い方針"
      description: "必要な種類、保管場所、利用主体、ローテーション方針だけを記載し、値そのものは記載しないでください。"
      placeholder: "値を含めず、アクセス境界と取り扱い手順だけを記載してください。"
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: "依存関係・blocker"
      description: "先に完了が必要なIssue、承認、外部判断、環境準備、未解決事項を記載してください。"
      placeholder: "なければ「なし」と記載してください。"
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: "受け入れ条件"
      description: "実施可否と完了を判定できる、検証可能な条件を記載してください。"
      placeholder: |
        - [ ] 条件1
        - [ ] 条件2
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: "必須検証"
      description: "dry-run、テスト、監視、データ確認、rollback確認、Human review項目を記載してください。"
      placeholder: "各段階で実行する検証と期待結果を記載してください。"
    validations:
      required: true

  - type: dropdown
    id: risk
    attributes:
      label: "Risk"
      description: "失敗時の影響、外部作用、復旧難度、必要権限の最大値から申告してください。"
      options:
        - "R0"
        - "R1"
        - "R2"
        - "R3"
    validations:
      required: true

  - type: dropdown
    id: execution
    attributes:
      label: "Execution"
      description: "想定する実行レーンを申告してください。Riskを下げるものではありません。"
      options:
        - "Cloud Codex"
        - "Local Codex"
        - "Human"
    validations:
      required: true

  - type: dropdown
    id: spec_level
    attributes:
      label: "Spec level"
      description: "必要な仕様の重さを申告してください。R2は原則Full、R3はFullに加えて操作ごとの承認が必要です。"
      options:
        - "None（独立した詳細仕様書なし）"
        - "Light"
        - "Full"
    validations:
      required: true

  - type: dropdown
    id: approval
    attributes:
      label: "Approval"
      description: "このIssueで必要と考える最も高い承認ゲートを申告してください。"
      options:
        - "None（個別承認なし）"
        - "Plan"
        - "Execute"
        - "Production"
    validations:
      required: true

  - type: textarea
    id: approval_gates
    attributes:
      label: "承認ゲートごとの操作"
      description: "Plan / Execute / Productionの各ゲートで、承認が必要な対象・環境・操作を具体化してください。"
      placeholder: |
        - Plan:
        - Execute:
        - Production:
    validations:
      required: true

  - type: checkboxes
    id: safety_confirmation
    attributes:
      label: "無承認操作を行わない確認"
      description: "次の安全境界を確認してください。"
      options:
        - label: "個別の明示承認なしにproduction write、deploy、merge、secret変更を行いません。"
          required: true
