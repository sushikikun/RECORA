name: Persona Human Review Fix

on:
  push:
    branches:
      - feat/issue-168-measurement-persona-compiler-v3

permissions:
  contents: write

jobs:
  apply-verify-and-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/issue-168-measurement-persona-compiler-v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Reconstruct and apply reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            scripts/.persona-human-review-fix/part00a.b64 \
            scripts/.persona-human-review-fix/part00b.b64 \
            scripts/.persona-human-review-fix/part01.b64 \
            scripts/.persona-human-review-fix/part02.b64 \
            scripts/.persona-human-review-fix/part03.b64 \
            | base64 --decode > /tmp/apply-persona-human-review-fixes.py
          echo "2d87e4e2455dc0323995fba71d9854cd4feb52365594b5519f1f3a30e3340dc3  /tmp/apply-persona-human-review-fixes.py" | sha256sum --check
          python - <<'PY'
          from pathlib import Path

          path = Path("/tmp/apply-persona-human-review-fixes.py")
          text = path.read_text(encoding="utf-8")

          ambiguous = """replace_once(
              COMPILER,
              '''      triggerSituation: `${input.subject.primary.name}について候補を探し、比較し、判断する場面`,''',
              '''      triggerSituation: `${selectionInput.subject.semanticName}について候補を探し、比較し、判断する場面`,'''
          )
          """
          replace_first = """content = read(COMPILER)
          old_trigger_situation = '''      triggerSituation: `${input.subject.primary.name}について候補を探し、比較し、判断する場面`,'''
          new_trigger_situation = '''      triggerSituation: `${selectionInput.subject.semanticName}について候補を探し、比較し、判断する場面`,'''
          if content.count(old_trigger_situation) != 2:
              raise RuntimeError("measurement-persona-compiler.ts: expected two triggerSituation matches")
          write(COMPILER, content.replace(old_trigger_situation, new_trigger_situation, 1))
          """
          profile_sizes = '''  const projections = [50, 100, 200].map((size) =>'''
          typed_profile_sizes = '''  const projections = ([50, 100, 200] as const).map((size) =>'''

          if text.count(ambiguous) != 1:
              raise SystemExit(f"decoded patch ambiguous target mismatch: {text.count(ambiguous)}")
          text = text.replace(ambiguous, replace_first, 1)
          if text.count(profile_sizes) != 1:
              raise SystemExit(f"decoded patch profile-size target mismatch: {text.count(profile_sizes)}")
          text = text.replace(profile_sizes, typed_profile_sizes, 1)
          path.write_text(text, encoding="utf-8", newline="\n")
          PY
          echo "b61c931c697ea7ab8ecf1d9d6fbafe2506a7020c56d27fd8b256b5210b8633bb  /tmp/apply-persona-human-review-fixes.py" | sha256sum --check
          python -m py_compile /tmp/apply-persona-human-review-fixes.py
          python /tmp/apply-persona-human-review-fixes.py
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Run dedicated Persona verifier
        run: npx --no-install tsx scripts/verify-recora-measurement-persona-compiler.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Clean temporary transport files and validate final scope
        shell: bash
        run: |
          set -euo pipefail
          rm -rf scripts/.persona-human-review-fix
          rm .github/workflows/persona-human-review-fix.yml
          git diff --check
          python - <<'PY'
          import subprocess

          expected = {
              "docs/architecture/measurement-design/recora_measurement_persona_compiler_v3_ja.md",
              "lib/recora/measurement-persona-catalog-common.ts",
              "lib/recora/measurement-persona-catalog-industry.ts",
              "lib/recora/measurement-persona-catalog.ts",
              "lib/recora/measurement-persona-compiler.ts",
              "lib/recora/measurement-persona-contract.ts",
              "lib/recora/measurement-persona-selection-rules.ts",
              "scripts/fixtures/recora-measurement-persona-gold-fixtures.ts",
              "scripts/verify-recora-measurement-persona-compiler.ts",
          }
          actual = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", "origin/master"],
                  text=True,
              ).splitlines()
          )
          if actual != expected:
              missing = sorted(expected - actual)
              extra = sorted(actual - expected)
              raise SystemExit(f"Final scope mismatch; missing={missing}; extra={extra}")
          print("Final scope validated:", len(actual), "files")
          PY

      - name: Commit reviewed implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            lib/recora/measurement-persona-contract.ts \
            lib/recora/measurement-persona-compiler.ts \
            scripts/fixtures/recora-measurement-persona-gold-fixtures.ts \
            scripts/verify-recora-measurement-persona-compiler.ts \
            scripts/.persona-human-review-fix \
            .github/workflows/persona-human-review-fix.yml
          git diff --cached --check
          git commit -m "fix(recora): align persona compiler with final G1A contract"
          git push origin HEAD:feat/issue-168-measurement-persona-compiler-v3
