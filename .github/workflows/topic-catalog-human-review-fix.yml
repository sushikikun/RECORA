name: Topic Catalog Human Review Fix

on:
  push:
    branches:
      - feat/issue-169-topic-catalog-freeze-v3

permissions:
  contents: write

jobs:
  apply-verify-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/issue-169-topic-catalog-freeze-v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply Human Review patch
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/.apply-topic-catalog-human-review-fix.py
          python scripts/.apply-topic-catalog-human-review-fix.py
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Run dedicated Topic Catalog verifier
        run: npx --no-install tsx scripts/verify-recora-measurement-topic-catalog.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Remove transport files and validate final scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          rm -f \
            scripts/.apply-topic-catalog-human-review-fix.py \
            scripts/.probe-delete-me \
            scripts/.topic-catalog-fix-marker \
            scripts/.topic-catalog-fix-transport-readme \
            scripts/.topic-catalog-human-review-fix-note \
            scripts/.topic-catalog-human-review-fix-placeholder \
            scripts/.topic-catalog-human-review-fix.tar.gz.b64 \
            scripts/.transport-probe \
            scripts/.transport-probe-2 \
            scripts/.transport-probe-3 \
            scripts/.transport-probe-4 \
            .github/workflows/topic-catalog-human-review-fix.yml
          git diff --check
          python - <<'PY'
          import subprocess

          expected = {
              "docs/architecture/measurement-design/recora_measurement_topic_catalog_v3_ja.md",
              "lib/recora/measurement-topic-catalog-common.ts",
              "lib/recora/measurement-topic-catalog-industry.ts",
              "lib/recora/measurement-topic-catalog-structure.ts",
              "lib/recora/measurement-topic-catalog.ts",
              "lib/recora/measurement-topic-contract.ts",
              "scripts/verify-recora-measurement-topic-catalog.ts",
          }
          base = subprocess.check_output(
              ["git", "merge-base", "origin/master", "HEAD"], text=True
          ).strip()
          actual = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", base], text=True
              ).splitlines()
          )
          if actual != expected:
              raise SystemExit(
                  f"final scope mismatch: missing={sorted(expected - actual)} "
                  f"extra={sorted(actual - expected)}"
              )
          print("Final scope validated:", len(actual), "files")
          PY

      - name: Commit reviewed Catalog fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(recora): harden measurement topic catalog authority"
          git push origin HEAD:feat/issue-169-topic-catalog-freeze-v3
