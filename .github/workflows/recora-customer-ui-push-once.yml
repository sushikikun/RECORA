name: Recora customer UI push one-time

on:
  push:
    branches:
      - codex/customer-report-current

permissions:
  contents: write

concurrency:
  group: recora-customer-ui-push-one-time
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/customer-report-current
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply customer information architecture updates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          source = Path('.github/workflows/recora-customer-ui-structure-once.yml').read_text(encoding='utf-8')
          command = next(
              line.strip()[5:]
              for line in source.splitlines()
              if line.strip().startswith('run: python -c ')
          )
          subprocess.run(command, shell=True, check=True)
          PY

      - name: Validate
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run recora:dashboard-read-model:check
          git diff --check

      - name: Commit implementation and remove one-time workflows
        shell: bash
        run: |
          rm -f \
            .github/workflows/recora-customer-ui-structure-once.yml \
            .github/workflows/recora-customer-ui-push-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            lib/recora/nav-config.ts \
            components/recora/customer-analysis/related-analysis.tsx \
            components/recora/customer-analysis/overview.tsx \
            components/recora/customer-analysis/brand.tsx \
            components/recora/customer-dashboard-v03-analysis.ts \
            components/recora/customer-dashboard-v03.tsx \
            .github/workflows/recora-customer-ui-structure-once.yml \
            .github/workflows/recora-customer-ui-push-once.yml
          git commit -m "Improve customer report information architecture"
          git push origin HEAD:codex/customer-report-current
