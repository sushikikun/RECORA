name: Recora workflow probe

on:
  push:
    branches:
      - codex/customer-report-current

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/customer-report-current
          fetch-depth: 0
          persist-credentials: true
      - name: Verify branch write
        run: |
          printf 'workflow probe succeeded\n' > recora-workflow-probe.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recora-workflow-probe.txt
          git commit -m "Verify workflow branch write"
          git push origin HEAD:codex/customer-report-current
