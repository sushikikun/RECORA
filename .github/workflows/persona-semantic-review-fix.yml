name: Persona Semantic Review Fix

on:
  push:
    branches:
      - feat/issue-168-measurement-persona-compiler-v3

permissions:
  contents: write

jobs:
  apply-verify-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/issue-168-measurement-persona-compiler-v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply reviewed semantic fixes
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/.persona-semantic-review-fix.py
          python scripts/.persona-semantic-review-fix.py
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Update frozen alternatives to contract-safe reviewed output
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install tsx scripts/.emit-contract-safe-persona-alternatives.ts \
            > /tmp/persona-contract-safe-alternatives.json
          python -m py_compile scripts/.update-persona-gold-alternatives.py
          python scripts/.update-persona-gold-alternatives.py \
            /tmp/persona-contract-safe-alternatives.json
          git diff --check

      - name: Run dedicated Persona verifier
        run: npx --no-install tsx scripts/verify-recora-measurement-persona-compiler.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Remove transport files and validate final scope
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/.persona-semantic-review-fix.py
          rm scripts/.emit-contract-safe-persona-alternatives.ts
          rm scripts/.update-persona-gold-alternatives.py
          rm .github/workflows/persona-semantic-review-fix.yml
          git diff --check
          python - <<'PY'
          import subprocess

          expected = {
              "docs/architecture/measurement-design/recora_measurement_persona_compiler_v3_ja.md",
              "lib/recora/measurement-persona-catalog-common.ts",
              "lib/recora/measurement-persona-catalog-industry.ts",
              "lib/recora/measurement-persona-catalog.ts",
              "lib/recora/measurement-persona-compiler.ts",
              "lib/recora/measurement-persona-contract.ts",
              "lib/recora/measurement-persona-selection-rules.ts",
              "scripts/fixtures/recora-measurement-persona-gold-fixtures.ts",
              "scripts/verify-recora-measurement-persona-compiler.ts",
          }
          actual = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", "origin/master"],
                  text=True,
              ).splitlines()
          )
          if actual != expected:
              raise SystemExit(
                  f"final scope mismatch: missing={sorted(expected - actual)} "
                  f"extra={sorted(actual - expected)}"
              )
          print("Final scope validated:", len(actual), "files")
          PY

      - name: Commit reviewed semantic fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            lib/recora/measurement-persona-contract.ts \
            lib/recora/measurement-persona-catalog-common.ts \
            lib/recora/measurement-persona-selection-rules.ts \
            lib/recora/measurement-persona-compiler.ts \
            scripts/fixtures/recora-measurement-persona-gold-fixtures.ts \
            scripts/verify-recora-measurement-persona-compiler.ts \
            docs/architecture/measurement-design/recora_measurement_persona_compiler_v3_ja.md \
            scripts/.persona-semantic-review-fix.py \
            scripts/.emit-contract-safe-persona-alternatives.ts \
            scripts/.update-persona-gold-alternatives.py \
            .github/workflows/persona-semantic-review-fix.yml
          git diff --cached --check
          git commit -m "fix(recora): validate persona alternatives and exclusions"
          git push origin HEAD:feat/issue-168-measurement-persona-compiler-v3
