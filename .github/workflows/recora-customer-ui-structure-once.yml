name: Recora customer UI structure one-time

on:
  pull_request:
    branches: [master]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: recora-customer-ui-structure-one-time
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/customer-report-current' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/customer-report-current
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply customer information architecture updates
