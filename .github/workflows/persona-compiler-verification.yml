name: Persona Compiler Verification

on:
  push:
    branches:
      - feat/issue-168-measurement-persona-compiler-v3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run measurement Persona Compiler verifier
        run: npx --no-install tsx scripts/verify-recora-measurement-persona-compiler.ts
