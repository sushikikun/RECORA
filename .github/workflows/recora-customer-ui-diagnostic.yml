name: Recora customer UI diagnostic

on:
  push:
    branches:
      - codex/customer-report-current

permissions:
  contents: write

concurrency:
  group: recora-customer-ui-diagnostic
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/customer-report-current
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply, validate, and publish diagnostics
        shell: bash
        run: |
          set +e
          LOG=/tmp/recora-customer-ui-run.log
          : > "$LOG"

          python - <<'PY' >> "$LOG" 2>&1
          from pathlib import Path
          import subprocess

          source = Path('.github/workflows/recora-customer-ui-structure-once.yml').read_text(encoding='utf-8')
          command = next(
              line.strip()[5:]
              for line in source.splitlines()
              if line.strip().startswith('run: python -c ')
          )
          subprocess.run(command, shell=True, check=True)
          PY
          status=$?

          if [ "$status" -eq 0 ]; then
            npm ci >> "$LOG" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            npm run typecheck >> "$LOG" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            npm run lint >> "$LOG" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            npm run recora:dashboard-read-model:check >> "$LOG" 2>&1 || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            git diff --check >> "$LOG" 2>&1 || status=$?
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
            cp "$LOG" recora-customer-ui-run.log
            git add recora-customer-ui-run.log
            git commit -m "Record customer UI implementation failure"
            git push origin HEAD:codex/customer-report-current
            exit 0
          fi

          rm -f \
            .github/workflows/recora-customer-ui-structure-once.yml \
            .github/workflows/recora-customer-ui-push-once.yml \
            .github/workflows/recora-customer-ui-diagnostic.yml \
            .github/workflows/recora-workflow-probe.yml \
            recora-workflow-probe.txt \
            recora-customer-ui-run.log

          git add -A -- \
            lib/recora/nav-config.ts \
            components/recora/customer-analysis/related-analysis.tsx \
            components/recora/customer-analysis/overview.tsx \
            components/recora/customer-analysis/brand.tsx \
            components/recora/customer-dashboard-v03-analysis.ts \
            components/recora/customer-dashboard-v03.tsx \
            .github/workflows/recora-customer-ui-structure-once.yml \
            .github/workflows/recora-customer-ui-push-once.yml \
            .github/workflows/recora-customer-ui-diagnostic.yml \
            .github/workflows/recora-workflow-probe.yml \
            recora-workflow-probe.txt \
            recora-customer-ui-run.log
          git commit -m "Improve customer report information architecture"
          git push origin HEAD:codex/customer-report-current
