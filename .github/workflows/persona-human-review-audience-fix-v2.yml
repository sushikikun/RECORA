name: Persona Human Review Audience Fix V2

on:
  push:
    branches:
      - feat/issue-168-measurement-persona-compiler-v3

permissions:
  contents: write

jobs:
  repair-apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/issue-168-measurement-persona-compiler-v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Reuse and repair reviewed patch script
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path(".github/workflows/persona-human-review-audience-fix.yml")
          source = workflow.read_text(encoding="utf-8")
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          script = textwrap.dedent(source[start:end])

          old = '''    ''' + "'''" + '''  recipe({
            recipeKey: \"standard_b2b\",''' + "'''" + ''','''
          new = '''    "  recipe({\\n    recipeKey: \\\"standard_b2b\\\","'''
          if script.count(old) != 1:
              raise SystemExit(f"standard_b2b marker repair count={script.count(old)}")
          script = script.replace(old, new, 1)

          patch = Path("/tmp/apply-persona-audience-fixes.py")
          patch.write_text(script, encoding="utf-8", newline="\n")
          compile(patch.read_text(encoding="utf-8"), str(patch), "exec")
          exec(compile(patch.read_text(encoding="utf-8"), str(patch), "exec"), {})

          Path(".github/workflows/persona-human-review-audience-fix-v2.yml").unlink()
          PY
          git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Run dedicated Persona verifier
        run: npx --no-install tsx scripts/verify-recora-measurement-persona-compiler.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit reviewed fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            lib/recora/measurement-persona-contract.ts \
            lib/recora/measurement-persona-selection-rules.ts \
            lib/recora/measurement-persona-compiler.ts \
            scripts/verify-recora-measurement-persona-compiler.ts \
            docs/architecture/measurement-design/recora_measurement_persona_compiler_v3_ja.md \
            .github/workflows/persona-human-review-audience-fix.yml \
            .github/workflows/persona-human-review-audience-fix-v2.yml
          git diff --cached --check
          git commit -m "fix(recora): honor audience in persona selection"
          git push origin HEAD:feat/issue-168-measurement-persona-compiler-v3
