name: Topic Child B Inspect

on:
  push:
    branches:
      - feat/issue-169-topic-compiler-v3

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-169-topic-compiler-v3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx --no-install tsx scripts/.inspect-topic-catalog-child-b.ts
